<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pinterest Anime - Khám phá thế giới anime tuyệt đẹp</title>
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/home.css">

</head>

<body>
    <!-- Header -->
    <header class="header">
        <div class="header-container">
            <div class="logo-section">
                <div class="logo">
                    <div class="logo-icon">
                        <i class="fas fa-palette"></i>
                    </div>
                    <h1 onclick="window.location.href='index.html?tags=&number=0'">Pinterest Anime</h1>
                </div>

            </div>

            <div class="header-tags">


            </div>

            <div class="search-section">
                <div>
                    <div id="suggestions_listTagsAll">
                        <ul id="suggestions_listTags"></ul>
                    </div>
                    <input type="text" class="search-input" placeholder="Nhập tags (vd: hatsune_miku long_hair)">
                    
                </div> <button class="search-btn">Tìm kiếm</button>
            </div>
           
        </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Hero Section -->
        <section class="hero-section">
            <div class="hero-background">
                <img src="3F3F_jacket.webp" alt="Distorted Fate" class="hero-image">
                <div class="hero-overlay"></div>
            </div>
            <div class="hero-content">
                <h2 class="hero-title">Distorted Fate</h2>
                <p class="hero-subtitle">Khám phá thế giới anime tuyệt đẹp với hàng nghìn hình ảnh chất lượng cao</p>
            </div>
        </section>

        <!-- Gallery Section -->
        <section class="gallery-section">
            <div class="gallery-container">
                <div class="main-gallery">
                    <div class="gallery-grid" id="galleryGrid">
                        <!-- Images will be loaded by JavaScript -->
                    </div>
                </div>

                <div class="sidebar">
                    <h3 class="sidebar-title">Gợi ý cho bạn</h3>
                    <div class="sidebar-images" id="sidebarImages">
                        <!-- Sidebar images will be loaded by JavaScript -->
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-content">
            <p>&copy; 2024 Pinterest Anime. Tất cả quyền được bảo lưu.</p>
            <div class="footer-links">
                <a href="#" class="footer-link">Về chúng tôi</a>
                <a href="#" class="footer-link">Điều khoản</a>
                <a href="#" class="footer-link">Bảo mật</a>
            </div>
        </div>
    </footer>

    <header class="header change-loadier ">
        <button class="change-btn" onclick="searchImgByNumberTrang(-1)">Trang trước</button>
        <div id="nuber-trang"></div>
        <button class="change-btn" onclick="searchImgByNumberTrang(1)">Trang sau</button>
    </header>
    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner">
            <i class="fas fa-spinner fa-spin"></i>
        </div>
    </div>
    <script src="scripts/utils.js"></script>
    <script src="scripts/data.js"></script>

    <script src="scripts/home.js"></script>
</body>

</html>
