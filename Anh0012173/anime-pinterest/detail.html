<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi tiết hình ảnh - Pinterest Anime</title>
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/detail.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>
    <!-- Header là thành công cụ trên -->
    <header class="header">
        <div class="header-container">
            <div class="logo-section">
                <div class="logo">
                    <div class="logo-icon">
                        <i class="fas fa-palette"></i>
                    </div>
                    <h1 onclick="window.location.href='index.html?tags=&number=0'">Pinterest Anime</h1>
                </div>
                <button class="back-btn" id="detail_out"><i class="fas fa-home"></i>
                    Trang chủ</button>
            </div>


            <div class="header-tags">


            </div>

            <div class="search-section">
                <div>
                    <div id="suggestions_listTagsAll">
                        <ul id="suggestions_listTags"></ul>
                    </div>
                    <input type="text" class="search-input" placeholder="Nhập tags (vd: hatsune_miku long_hair)">

                </div>
                <button class="search-btn">Tìm kiếm</button>
            </div>
        </div>
    </header>


    <!-- Main Content hiển thị nội dụng -->
    <main class="detail-main">
        <div class="detail-container" id="detail-container">
            <!-- Image Section ảnh cơ lớn của trang chi tiết-->
            <div class="image-section">
                <div class="main-image-container">
                    <img id="mainImage" src="" alt="Anime Detail" class="main-image">
                    <div class="image-actions">
                        <button class="action-btn-round " id="Yeuthich" title="Thích">
                            <i class="fas fa-heart"></i>
                        </button>

                        <button class="action-btn-round" id="taiXuongImg" title="Mở trong thẻ mới">
                            <i class="fas fa-download"></i>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Info Section  thẻ thông tin ảnh-->
            <div class="info-section">


                <!-- Tags Section khu để chứ danh sácg tags-->
                <div class="tags-section">
                    <h3 class="section-title">Tags</h3>
                    <div class="tags-container" id="tagsContainer">

                    </div>
                </div>

                <!-- Metadata Section thông tin chí tiết của ảnh-->
                <div class="metadata-section">
                    <h3 class="section-title">Thông tin chi tiết</h3>
                    <div class="metadata-grid">
                        <div class="metadata-item">
                            <span class="metadata-label">Owner:</span>
                            <span class="metadata-value" id="imageOwner"></span>
                        </div>
                        <div class="metadata-item">
                            <span class="metadata-label">Change:</span>
                            <span class="metadata-value" id="imageChange"></span>
                        </div>
                        <div class="metadata-item">
                            <span class="metadata-label">ID:</span>
                            <span class="metadata-value" id="imageId"></span>
                        </div>
                        <div class="metadata-item">
                            <span class="metadata-label">Size:</span>
                            <span class="metadata-value" id="imageSize"></span>
                        </div>
                        <div class="metadata-item">
                            <span class="metadata-label">Status:</span>
                            <span class="metadata-value status-active" id="imageStatus"></span>
                        </div>
                        <div class="metadata-item">
                            <span class="metadata-label">Rating:</span>
                            <span class="metadata-value" id="imageRating"></span>
                        </div>
                        <div class="metadata-item">
                            <span class="metadata-label">Comments:</span>
                            <span class="metadata-value" id="imageComments">0</span>
                        </div>
                    </div>
                </div>

                <!-- Actions Section -->
                <div class="actions-section">


                </div>
            </div>
        </div>

        <!-- Related Images Section khu để chưa các thẻ hiển thi liên quan-->
        <section class="related-section">
            <h3 class="section-title">Hình ảnh liên quan</h3>
            <div class="related-grid" id="relatedGrid">

            </div>
        </section>
    </main>
    <div class="header change-loadier ">
        <button class="change-btn" onclick="searchImgByNumberTrang(-1)">Trang trước</button>
        <div id="nuber-trang"></div>
        <button class="change-btn" onclick="searchImgByNumberTrang(1)">Trang sau</button>
    </div>
    <!-- nền chờ-->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner">
            <i class="fas fa-spinner fa-spin"></i>
        </div>
    </div>


    <script src="scripts/data.js"></script>
    <script src="scripts/utils.js"></script>
    <script src="scripts/detail.js"></script>
</body>

</html>
