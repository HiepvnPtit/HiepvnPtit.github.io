<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pinterest Anime - Chi tiết</title>
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/detail.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <div class="header-content">
            <div class="logo">
                <span class="logo-icon">🎨</span>
                <h1>Pinterest Anime</h1>
            </div>
            <nav class="nav">
                <a href="index.html" class="nav-link">Trang chủ</a>
                <a href="search.html" class="nav-link">Tìm kiếm</a>
            </nav>
            <div class="search-container">
                <input type="text" placeholder="Nhập tags (vd: hatsune, miku long_hair)" class="search-input">
                <button class="search-btn">Tìm kiếm</button>
            </div>
        </div>
    </header>

    <main class="main">
        <div class="detail-container">
            <div class="image-section">
                <div class="main-image">
                    <img id="mainImage" src="/placeholder.svg" alt="Anime Image">
                </div>
            </div>
            
            <div class="info-section">
                <div class="image-info">
                    <h2 id="imageTitle">Chi tiết hình ảnh</h2>
                    <div class="meta-info">
                        <div class="meta-item">
                            <span class="meta-label">Owner:</span>
                            <span class="meta-value" id="imageOwner">danbooru</span>
                        </div>
                        <div class="meta-item">
                            <span class="meta-label">ID:</span>
                            <span class="meta-value" id="imageId">5909168</span>
                        </div>
                        <div class="meta-item">
                            <span class="meta-label">Size:</span>
                            <span class="meta-value" id="imageSize">2048 x 1152</span>
                        </div>
                        <div class="meta-item">
                            <span class="meta-label">Status:</span>
                            <span class="meta-value status-active" id="imageStatus">active</span>
                        </div>
                        <div class="meta-item">
                            <span class="meta-label">Rating:</span>
                            <span class="meta-value" id="imageRating">general</span>
                        </div>
                        <div class="meta-item">
                            <span class="meta-label">Comments:</span>
                            <span class="meta-value" id="imageComments">0</span>
                        </div>
                    </div>
                    
                    <div class="tags-section">
                        <h4>Tags:</h4>
                        <div class="tags-container" id="tagsContainer">
                            <!-- Tags will be loaded by JavaScript -->
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <section class="related-section">
            <h3>Hình ảnh liên quan</h3>
            <div class="related-grid" id="relatedGrid">
                <!-- Related images will be loaded by JavaScript -->
            </div>
        </section>
    </main>

    <script src="scripts/data.js"></script>
    <script src="scripts/main.js"></script>
    <script src="scripts/detail.js"></script>
</body>
</html>
